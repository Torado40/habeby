body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.pos{color:var(--good)!important} .neg{color:var(--bad)!important}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:14px 10px}
.top h1{font-size:26px;line-height:1.1}
.top .sub{font-size:13px;color:var(--muted)}
.top .grow{flex:1;min-width:0}
.brandmark{display:flex;align-items:center;gap:8px;font:800 20px/1 var(--f-display);color:var(--brand)}
:root[data-theme="dark"] .brandmark{color:var(--sand)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brandmark{color:var(--sand)}}
.brandmark i{width:26px;height:26px;border-radius:8px;background:var(--brand);display:grid;place-items:center;font-style:normal;color:var(--sand);font-size:15px}
/* hero */
.hero{border-radius:22px;padding:18px;color:var(--brand-ink);background:radial-gradient(120% 140% at 100% 0%,#13707f 0%,var(--brand) 45%,var(--brand-2) 100%);box-shadow:0 12px 30px rgba(7,54,64,.35);display:grid;gap:14px;position:relative;overflow:hidden}
.hero .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;font-weight:700}
.hero .big{font:800 42px/1 var(--f-display);color:var(--sand)}
.hero .big small{font:600 15px var(--f-body);color:var(--brand-ink);opacity:.8;margin-left:6px}
.hero .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero .grid div{background:rgba(255,255,255,.09);border-radius:12px;padding:9px 10px;font-size:11px;opacity:.95}
.hero .grid b{display:block;font:700 16px var(--f-display);margin-top:2px}
.hero .cyc{display:flex;align-items:center;gap:10px;font-size:12px;opacity:.9}
.hero .cyc .bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.hero .cyc .bar i{display:block;height:100%;background:var(--sand);border-radius:3px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.wcard{padding:13px;display:grid;gap:8px;text-align:left;border:0;position:relative;overflow:hidden;min-width:0}
.wcard::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--wc)}
.wcard .h{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.wcard .v{font:800 24px/1 var(--f-display)}
.wcard .s{font-size:11px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block;background:var(--wc)}
.track{position:relative;height:7px;border-radius:4px;background:var(--surface-2)}
.fill{height:100%;border-radius:4px;background:var(--wc)}
.pace{position:absolute;top:-3px;width:2px;height:13px;background:var(--ink);border-radius:1px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.action{border:0;border-radius:16px;padding:14px;display:flex;gap:10px;align-items:center;font-weight:700;text-align:left}
.action svg{width:24px;height:24px;flex:none}
.action small{display:block;font-weight:500;font-size:12px;opacity:.8}
.action.scan{background:var(--sand);color:var(--sand-ink)}
.action.add{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.sec-t{margin:22px 2px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-t h2{font-size:17px}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left}
.row:first-child{border-top:0}
.row .info{flex:1;min-width:0}
.row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;font-weight:700;flex:none}
.row .r small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--surface-2)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.sand{background:var(--sand);color:var(--sand-ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%;display:block;text-align:center}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.seg{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;padding:9px 0 8px;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--faint)}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--brand)}
:root[data-theme="dark"] .tabs button.on{color:var(--sand)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button.on{color:var(--sand)}}
.scrim{position:fixed;inset:0;background:rgba(5,14,18,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.sheet-h h2{font-size:20px;flex:1;min-width:0}
.sheet-b{overflow:auto;padding:0 16px 18px;flex:1;min-height:0}
.sheet-f{padding:10px 16px 14px;border-top:1px solid var(--line);display:flex;gap:8px}
.sheet-f .btn{flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.amount{width:100%;font:800 36px/1.1 var(--f-display);text-align:center;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.calc{text-align:center;font-size:14px;color:var(--muted);min-height:20px;margin-top:4px}
.wchips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.wchip{padding:10px 4px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;display:flex;gap:5px;align-items:center;justify-content:center;min-width:0}
.wchip.on{border-color:var(--wc);background:color-mix(in srgb,var(--wc) 12%,var(--surface))}
.form{display:grid;gap:12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f,div.f{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,.inp{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:500;color:var(--ink);width:100%;min-width:0}
.hint{font-weight:500;color:var(--faint)}
.banner{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--brand-soft)}
.banner.warn{background:var(--bad-soft)}
.banner.sand{background:var(--warn-soft)}
.tbl{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:4px 8px;overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;font-weight:700;padding:8px 6px;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:9px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
table.t tr.click{cursor:pointer}
table.t.compact{font-size:12px}table.t.compact th{font-size:9.5px;letter-spacing:.03em;padding:8px 3px}table.t.compact td{padding:9px 3px}
.sumcard{padding:14px;display:grid;gap:10px;margin-top:10px;position:relative;overflow:hidden}
.sumcard::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--wc)}
.sumcard .h{display:flex;align-items:center;gap:8px}
.sumcard .h h3{font-size:17px;flex:1}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:11px;color:var(--muted)}
.kv b{display:block;color:var(--ink);font:700 16px var(--f-display);margin-top:2px}
.chart{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 8px 8px;position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,0)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:0 8px 4px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;font-size:14px;font-weight:600;max-width:90%}
.toast button{background:none;border:0;color:var(--sand);font-weight:700;margin-left:10px}
.daybar{display:flex;justify-content:space-between;align-items:baseline;padding:14px 4px 6px;font-weight:700}
.daybar span{font-weight:600;color:var(--muted);font-size:13px}
/* confirm rows */
.prop{background:var(--surface);border-radius:14px;padding:12px;display:grid;gap:8px;border:1px solid var(--line);margin-top:8px;position:relative;overflow:hidden}
.prop::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--wc)}
.prop.off{opacity:.45}
.prop .top1{display:flex;gap:8px;align-items:center}
.prop .top1 input[type=checkbox]{width:20px;height:20px;flex:none}
.prop .nm{flex:1;min-width:0;font-weight:600}
.prop .amt{width:96px;text-align:right;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px}
.mini{display:flex;gap:4px;flex-wrap:wrap}
.mini button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:600;display:inline-flex;gap:5px;align-items:center}
.mini button.on{border-color:var(--wc);background:color-mix(in srgb,var(--wc) 14%,var(--surface))}
.why{font-size:11px;color:var(--faint)}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.tag.dup{background:var(--warn-soft);color:var(--warn)}
</style>

<body>
<div id="app"></div>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div id="sheet-root"></div>
<div id="toast-root"></div>
<script>
(() => {
'use strict';
const I = {
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/></svg>',
  sum:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 19h16M7 16V9M12 16V5M17 16v-4"/></svg>',
  hist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  lists:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  scan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 9h8M8 12h8M8 15h5"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const WALLETS = [
  {k:'personal', label:'Personal', color:'var(--w-personal)'},
  {k:'home', label:'Home', color:'var(--w-home)'},
  {k:'fuel', label:'Fuel', color:'var(--w-fuel)'},
  {k:'utilities', label:'Utilities', color:'var(--w-utilities)'}];
const WL = Object.fromEntries(WALLETS.map(w => [w.k, w]));
const wk = s => { const t = String(s||'').trim().toLowerCase(); return WALLETS.find(w => w.k === t || w.label.toLowerCase() === t)?.k || null; };
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const keyOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const daysBetween = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 86400000);
const todayKey = () => keyOf(new Date());
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtShort = k => { const d = parseKey(k); return d.getDate()+' '+MON[d.getMonth()]; };
const fmtDay = k => { const t = todayKey(); if (k === t) return 'Today'; if (k === addDays(t,-1)) return 'Yesterday'; const d = parseKey(k); return DOW[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]; };
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const money = v => { v = Math.round(v || 0); return (v < 0 ? '−' : '') + Math.abs(v).toLocaleString('en-US'); };
const signed = v => (v > 0.5 ? '+' : '') + money(v);
const norm = s => String(s||'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9؀-ۿ ]+/g,' ').replace(/\s+/g,' ').trim();
function calc(str) {
  const s = String(str ?? '').replace(/[,\s]/g, '').replace(/×/g,'*').replace(/÷/g,'/').replace(/^=/, '');
  if (!s) return null;
  if (!/^[\d.+\-*/()]+$/.test(s)) return NaN;
  let i = 0; const peek = () => s[i];
  function num() { if (peek() === '(') { i++; const v = expr(); if (peek() !== ')') throw 0; i++; return v; }
    if (peek() === '-') { i++; return -num(); } if (peek() === '+') { i++; return num(); }
    const m = s.slice(i).match(/^\d*\.?\d+/); if (!m) throw 0; i += m[0].length; return parseFloat(m[0]); }
  function term() { let v = num(); while (peek() === '*' || peek() === '/') { const o = s[i++]; const r = num(); v = o === '*' ? v*r : v/r; } return v; }
  function expr() { let v = term(); while (peek() === '+' || peek() === '-') { const o = s[i++]; const r = term(); v = o === '+' ? v+r : v-r; } return v; }
  try { const v = expr(); if (i !== s.length || !isFinite(v)) return NaN; return Math.round(v*100)/100; } catch { return NaN; }
}
const isExpr = s => /[+\-*/]/.test(String(s||'').replace(/^-/, ''));

// ---------- state, storage, migration ----------
const KEY = 'tally-data';
const S = { tab:'today', data:{cycles:[], entries:[], rules:{}, settings:{currency:'EGP'}}, histCycle:null, histWallet:'all', lastWallet:'personal' };
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.cycles) S.data = d; } catch {}
  try { const u = JSON.parse(localStorage.getItem('tally-ui') || '{}'); if (u.lastWallet) S.lastWallet = u.lastWallet; } catch {}
  migrate();
}
function migrate() { const d = S.data; d.rules = d.rules || {}; d.settings = d.settings || {currency:'EGP'}; d.version = 2; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S.data)); } catch { toast('Couldn’t save on this browser. Back up your data.'); } }
const saveUi = () => { try { localStorage.setItem('tally-ui', JSON.stringify({lastWallet:S.lastWallet})); } catch {} };
const cur = () => S.data.settings?.currency || 'EGP';

// ---------- cycles & budgets ----------
const sortedCycles = () => [...S.data.cycles].sort((a,b) => a.start.localeCompare(b.start));
const cycleFor = k => S.data.cycles.find(c => c.start <= k && k <= c.end) || null;
const curCycle = () => cycleFor(todayKey()) || sortedCycles().at(-1);
const cycleDays = c => daysBetween(c.start, c.end) + 1;
function nextCycleFrom(prev) {
  const start = addDays(prev.end, 1), len = daysBetween(prev.start, prev.end);
  return { id:start, start, end:addDays(start, len), budgets: JSON.parse(JSON.stringify(prev.budgets)), billsFund: prev.billsFund || 0,
    homeMode: prev.homeMode, utilMode: prev.utilMode, items: (prev.items || []).map(it => ({...it, bought:0, openingPaid:0})) };
}
function ensureCurrent() {
  const t = todayKey(); if (!S.data.cycles.length || cycleFor(t)) return;
  let made = 0, last = sortedCycles().at(-1); if (last.start > t) return;
  while (last.end < t && made < 24) { const n = nextCycleFrom(last); S.data.cycles.push(n); last = n; made++; }
  if (made) { save(); setTimeout(() => toast(`New cycle started: ${fmtShort(last.start)} – ${fmtShort(last.end)}. Budgets carried over.`), 400); }
}
const listItems = c => (c.items || []).filter(i => i.group !== 'bills');
const billItems = c => (c.items || []).filter(i => i.group === 'bills');
const sumPlanned = arr => arr.reduce((s,i) => s + (+i.planned || 0), 0);
const homeFromList = c => listItems(c).length > 0 && c.homeMode !== 'manual';
const utilFromList = c => billItems(c).length > 0 && c.utilMode === 'list' && sumPlanned(billItems(c)) > 0;
function budgetOf(c, w) {
  if (w === 'home' && homeFromList(c)) return sumPlanned(listItems(c));
  if (w === 'utilities' && utilFromList(c)) return sumPlanned(billItems(c));
  return +c.budgets?.[w]?.value || 0;
}
function entriesIn(c, wallet) { return S.data.entries.filter(e => e.date >= c.start && e.date <= c.end && (!wallet || e.wallet === wallet)); }
function openingPaid(c, w) { const arr = w === 'home' && homeFromList(c) ? listItems(c) : w === 'utilities' ? billItems(c) : []; return arr.reduce((s,i) => s + (+i.openingPaid || 0), 0); }
// spent / remaining / buffers for one wallet in one cycle
function metrics(c, wallet, asOf = todayKey()) {
  const N = cycleDays(c), B = budgetOf(c, wallet);
  const at = asOf < c.start ? c.start : asOf > c.end ? c.end : asOf, past = asOf > c.end;
  const elapsed = daysBetween(c.start, at) + 1, daysLeft = Math.max(1, N - elapsed + 1), after = N - elapsed;
  let before = openingPaid(c, wallet), today = 0;
  for (const e of entriesIn(c, wallet)) { if (e.date < at) before += e.amount; else if (e.date === at) today += e.amount; }
  const spent = before + today, daily = B / N, remaining = B - spent;
  const allowToday = (B - before) / daysLeft;
  return { N, B, elapsed, daysLeft, after, spent, today, daily, remaining, past,
    bufferNow: daily * elapsed - spent,                 // ahead (+) or behind (−) the even daily pace, including today
    perDayLeft: remaining / daysLeft,                   // what you can spend per day from today, incl. today
    allowToday, leftToday: allowToday - today,

const KEYWORDS = {

  personal: ['cafe','coffee','starbucks','costa','restaurant','haircut','barber','football','gym','cinema','uber','careem','indrive','gift','birthday','clothes','shoes','corona','pringles','pringels','monster','pepsi','snack','rave','scrunch','rice cake','dubai']

function learnedMap() {   // normalised note → most frequent wallet, from your own history + imported CSV rules
  const counts = new Map();

}

  const hit = lm.get(n); if (hit) return {w: hit.w, why: `you filed “${text}” under ${WL[hit.w].label} ${hit.n}×`};
  const toks = new Set(n.split(' ').filter(t => t.length > 2));

  for (const [k, v] of lm) { const kt = k.split(' ').filter(t => t.length > 2); if (!kt.length) continue; const inter = kt.filter(t => toks.has(t)).length; const s = 2*inter/(kt.length + toks.size || 1); if (s > bs) { bs = s; best = [k, v]; } }
  if (best && bs >= 0.5) return {w: best[1].w, why: `similar to “${best[0]}” in ${WL[best[1].w].label}`};
  for (const [w, kws] of Object.entries(KEYWORDS)) for (const kw of kws) if ((' ' + n + ' ').includes(' ' + kw + ' ') || (kw.length > 4 && n.includes(kw))) return {w, why: `“${kw}” usually goes to ${WL[w].label}`};

}
function matchItem(c, wallet, text) {
  const pool = wallet === 'home' ? listItems(c) : wallet === 'utilities' ? billItems(c) : [];
  const n = norm(text); let best = null, bs = 0;
  for (const it of pool) { const m = norm(it.name); if (!m) continue; let s = 0;
    if (n === m) s = 1; else if (n.includes(m) || m.includes(n)) s = 0.8; else { const a = new Set(n.split(' ')), b = m.split(' '); const inter = b.filter(t => t.length > 2 && a.has(t)).length; s = inter ? 2*inter/(a.size + b.length) : 0; }
    if (s > bs) { bs = s; best = it; } }
  return bs >= 0.5 ? best : null;
}

// ---------- scanning: receipts, screenshots, pasted text → proposals → your confirmation ----------
const DEFAULT_MODEL = 'claude-sonnet-5-5';
const OPENAI_MODEL = 'gpt-6-astra';
const PROVIDERS = {
  anthropic: {label:'Claude (Anthropic)', host:'console.anthropic.com \u2192 API Keys', prefix:'sk-ant-', model:DEFAULT_MODEL, name:'Anthropic'},
  openai:    {label:'ChatGPT (OpenAI)',   host:'platform.openai.com \u2192 API keys',  prefix:'sk-',     model:OPENAI_MODEL,  name:'OpenAI'}
};
const provOf = a => PROVIDERS[a && a.provider] ? a.provider : 'anthropic';
let rcCtl = null;
let aiSampleP = null, aiSampleReady = false;
function getSample() {
  if (!aiSampleP) aiSampleP = (async () => {
    try {
      const s = (typeof claude !== 'undefined' && claude.use) ? await claude.use('sample') : null;
      aiSampleReady = !!s; return s;
    } catch { return null; }
  })();
  return aiSampleP;
}
getSample();
function dataUrlToBlob(d) {
  const [h, b] = d.split(','); const bin = atob(b); const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], {type: (h.match(/:(.*?);/) || [, 'image/jpeg'])[1]});
}
function shrinkImage(file, max = 1568) {
  return new Promise(res => { const img = new Image(); img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); res(cv.toDataURL('image/jpeg', 0.85)); URL.revokeObjectURL(img.src); }; img.onerror = () => res(null); img.src = URL.createObjectURL(file); });
}
function parseJsonLoose(t) {
  try { return JSON.parse(t); } catch {}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) { try { return JSON.parse(f[1]); } catch {} }
  const i = t.indexOf('{'), j = t.lastIndexOf('}'); if (i >= 0 && j > i) { try { return JSON.parse(t.slice(i, j+1)); } catch {} }
  throw {code:'invalid_json'};
}
function openScan() {
  const has = aiSampleReady || !!aiConf().key;
  S._scan = {images: []};
  openSheet('Scan', `<p class="muted" style="margin-top:0">Add receipts or screenshots (bank SMS, InstaPay, delivery orders…). You can add several at once. ${has ? 'Claude reads every expense, Tally routes each one to a wallet, and nothing is saved until you confirm.' : '<b>To read them automatically, add your Anthropic API key below (one time).</b>'}</p>
    <div class="fgrid"><label class="btn sand block" for="sc-cam">Take photo</label><label class="btn primary block" for="sc-pick">Choose images</label></div>
    <input id="sc-cam" type="file" accept="image/*" capture="environment" hidden><input id="sc-pick" type="file" accept="image/*" multiple hidden>
    <div id="sc-thumbs" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"></div>
    <label class="f" style="margin-top:10px">Or paste text <span class="hint">· e.g. a bank SMS</span><textarea id="sc-text" class="inp" rows="3" placeholder="Paste a message or list of expenses"></textarea></label>
    ${has ? '' : `<div class="card" id="sc-keybox" style="padding:12px;margin-top:12px;display:grid;gap:8px"><b>One-time setup: your API key</b><span class="muted" style="font-size:13px">Pick a provider, then paste a key from ${PROVIDERS[provOf(aiConf())].host}. It’s saved only on this phone. Change this any time in Budgets → Scanning.</span><select id="sc-prov" class="inp">${Object.entries(PROVIDERS).map(([k,v]) => `<option value="${k}"${provOf(aiConf()) === k ? ' selected' : ''}>${v.label}</option>`).join('')}</select><input id="sc-key" class="inp" type="password" autocomplete="off" placeholder="sk-…"><button class="btn sand" data-act="sckey">Save key</button></div>`}
    <div id="sc-out"></div>`, `<button class="btn primary" data-act="scgo">Read & route</button>`);
  const add = async e => { for (const f of [...e.target.files].slice(0, 6 - S._scan.images.length)) { const d = await shrinkImage(f); if (d) S._scan.images.push(d); } e.target.value = '';
    $('#sc-thumbs').innerHTML = S._scan.images.map(d => `<img src="${d}" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:10px">`).join('') + (S._scan.images.length ? `<span class="muted" style="align-self:center;font-size:13px">${S._scan.images.length} added</span>` : ''); $('#sc-out').innerHTML = ''; };
  $('#sc-cam').addEventListener('change', add); $('#sc-pick').addEventListener('change', add);

async function runScan() {

  const items = [...listItems(c).map(i => `${i.id} | ${i.name} | home`), ...billItems(c).map(i => `${i.id} | ${i.name} | utilities`)].join('\n') || '(none)';
  const prompt = `You read receipts, invoices and payment screenshots (bank SMS, InstaPay, card notifications, delivery apps) for someone in Egypt. Text may be Arabic or English. Amounts are EGP unless shown otherwise.
Extract every separate expense. For a shop receipt, list each purchased line with its line total; if lines can't be read, give the receipt total as one line. For payment screenshots, each transaction is one line. Ignore balances, card numbers and anything that isn't money spent; refunds/credits are negative.

This person's own past choices (item → wallet) — follow them when an item matches:
${known || '(none yet)'}

${text ? 'Pasted text:\n' + text + '\n' : ''}

  } catch (e) {
    if (e?.name === 'AbortError') { $('#sc-out').innerHTML = ''; $('#sheet-f').hidden = false; return; }
    const msg = {not_granted:'Scanning needs your permission. Reload the page and allow it.', rate_limited:'Too many scans right now. Try again in a minute.', bad_key:'The API key was rejected. Check the key and provider in Budgets → Scanning. A ChatGPT Plus subscription is not an API key.', rate:'Too many requests right now. Try again in a minute.', invalid_json:'Couldn’t read that. Try a sharper, straight-on photo.', api:'The request was refused' + (e?.message ? ': ' + e.message : '.') + ' Check the model name in Budgets.'}[e?.code] || `Couldn’t reach ${PROVIDERS[provOf(aiConf())].name}. Check your connection.`;
    $('#sc-out').innerHTML = `<div class="banner warn" style="margin-top:12px">${esc(msg)}</div>`; $('#sheet-f').hidden = false;
  }
}
function buildProposals(res, c, lm) {
  const t = todayKey(), props = [];
  for (const rc of (res?.receipts || [])) {
    const date = rc.date && /^\d{4}-\d{2}-\d{2}$/.test(rc.date) && rc.date <= t ? rc.date : t;
    const lines = (rc.lines || []).filter(l => l && (l.name || rc.merchant) && +l.amount);
    if (!lines.length && +rc.total) lines.push({name: rc.merchant || 'Receipt', amount: +rc.total});
    let sum = 0;
    for (const l of lines) {
      const name = String(l.name || rc.merchant).trim(), amt = Math.round(+l.amount * 100) / 100; sum += amt;
      const mine = classify(name, lm), ai = wk(l.wallet);
      const w = mine?.w || ai || classify(rc.merchant, lm)?.w || S.lastWallet;
      const why = mine ? mine.why : ai ? 'Claude suggested ' + WL[ai].label : 'no match — please check';
      let itemId = (c.items || []).some(i => i.id === l.itemId) ? l.itemId : null;
      const it = itemId ? itemById(itemId) : matchItem(c, w, name); if (it) itemId = it.id;
      props.push({id: uid(), name, merchant: rc.merchant || '', amount: amt, qty: +l.qty || 1, wallet: w, itemId, date, why, sure: !!mine, on: true});
    }
    const rest = Math.round(((+rc.total || 0) - sum) * 100) / 100;
    if (lines.length > 1 && Math.abs(rest) >= 1) {   // tax, service, delivery, discounts
      const main = Object.entries(props.slice(-lines.length).reduce((m,p) => (m[p.wallet] = (m[p.wallet]||0) + p.amount, m), {})).sort((a,b)=>b[1]-a[1])[0]?.[0] || S.lastWallet;
      props.push({id: uid(), name: (rest < 0 ? 'Discount' : 'Fees / tax') + (rc.merchant ? ' · ' + rc.merchant : ''), merchant: rc.merchant || '', amount: rest, qty: 1, wallet: main, itemId: null, date, why: 'difference between the lines and the receipt total', on: true});
    }
  }
  // flag likely duplicates of things already logged
  for (const p of props) if (S.data.entries.some(e => e.date === p.date && Math.abs(e.amount - p.amount) < 0.5 && norm(e.note) === norm(p.name))) { p.dup = true; p.on = false; }
  S._props = props; S._propCycle = c.id;
  $('#sheet-f').hidden = false;
  renderProposals();
}
function renderProposals() {
  const props = S._props, c = S.data.cycles.find(x => x.id === S._propCycle) || curCycle();
  if (!props.length) { $('#sc-out').innerHTML = `<div class="banner warn" style="margin-top:12px">No expenses found. Try a clearer photo or paste the text.</div>`; return; }
  const on = props.filter(p => p.on), byW = WALLETS.map(w => ({w, s: on.filter(p => p.wallet === w.k).reduce((s,p)=>s+p.amount,0)})).filter(x => Math.abs(x.s) > 0);
  const pool = w => w === 'home' ? listItems(c) : w === 'utilities' ? billItems(c) : [];
  $('#sheet-b').innerHTML = `<div class="banner sand"><b>Check before saving.</b> ${props.length} expense${props.length>1?'s':''} found. Each is routed to a wallet — tap another wallet to move it, untick anything you don’t want.</div>
    <div class="seg" style="margin-top:10px">${byW.map(x => `<span class="pill" style="--wc:${x.w.color}"><span class="dot" style="margin-right:6px"></span>${x.w.label} ${money(x.s)}</span>`).join('')}</div>
    ${props.map(p => { const w = WL[p.wallet], pl = pool(p.wallet);
      return `<div class="prop ${p.on ? '' : 'off'}" style="--wc:${w.color}">
        <div class="top1"><input type="checkbox" data-pon="${p.id}" ${p.on ? 'checked' : ''} aria-label="Include ${esc(p.name)}"><div class="nm">${esc(p.name)} ${p.dup ? '<span class="tag dup">already logged?</span>' : ''}<div class="why">${esc(p.merchant && p.merchant !== p.name ? p.merchant + ' · ' : '')}${fmtDay(p.date)} · ${esc(p.why)}</div></div><input class="amt num" inputmode="decimal" data-pamt="${p.id}" value="${p.amount}" aria-label="Amount"></div>
        <div class="mini">${WALLETS.map(x => `<button class="${p.wallet===x.k?'on':''}" style="--wc:${x.color}" data-act="pwallet" data-v="${p.id}|${x.k}"><span class="dot"></span>${x.label}</button>`).join('')}</div>
        ${pl.length ? `<select class="inp" data-pitem="${p.id}" style="padding:7px 10px;font-size:14px" aria-label="Planned item"><option value="">Other ${w.label}</option>${pl.map(i => `<option value="${i.id}" ${p.itemId===i.id?'selected':''}>${esc(i.name)}</option>`).join('')}</select>` : ''}
      </div>`; }).join('')}`;
  $('#sheet-f').innerHTML = `<button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="pconfirm">Confirm ${on.length} · ${money(on.reduce((s,p)=>s+p.amount,0))}</button>`;
}
function confirmProposals() {
  const props = S._props.filter(p => p.on && +p.amount); if (!props.length) { toast('Nothing selected.'); return; }
  const rid = 'r' + uid(), ts = Date.now(), added = [];
  for (const p of props) {
    const e = {id:'e' + uid(), date: p.date, wallet: p.wallet, amount: +p.amount, note: p.name, receipt: rid, ts};
    if (p.itemId) { e.itemId = p.itemId; const it = itemById(p.itemId); if (it && it.group !== 'bills' && it.qty) it.bought = (+it.bought || 0) + (p.qty || 1); }
    if (p.merchant && p.merchant !== p.name) e.lines = [p.merchant];
    S.data.entries.push(e); added.push(e.id);
  }
  save(); closeSheet(); render();
  const tot = props.reduce((s,p)=>s+(+p.amount),0);
  toast(`Added ${props.length} expense${props.length>1?'s':''} · ${money(tot)} ${cur()}`, {label:'Undo', fn: () => { S.data.entries = S.data.entries.filter(e => !added.includes(e.id)); save(); render(); }});
}

// ---------- items ----------
function openItem(it, group) {
  const c = curCycle(), x = it || {id:null, group, name:'', qty:'', planned:'', bought:0, openingPaid:0}, bill = x.group === 'bills';
  S._item = {id: x.id, group: x.group, cycle: c.id};
  openSheet(x.id ? (bill ? 'Edit bill' : 'Edit item') : (bill ? 'Add bill' : 'Add item'), `<form class="form" id="item-form">
    <label class="f">Name<input id="it-name" value="${esc(x.name)}" required></label>
    ${bill ? `<label class="f">Expected amount<input id="it-planned" inputmode="decimal" value="${esc(x.planned ?? '')}"></label>` :
      `<div class="fgrid"><label class="f">Planned quantity<input id="it-qty" inputmode="decimal" value="${esc(x.qty ?? '')}"></label><label class="f">Planned cost<input id="it-planned" inputmode="decimal" value="${esc(x.planned ?? '')}" placeholder="e.g. 5*20*4"></label></div>
      <label class="f">Bought so far<input id="it-bought" inputmode="decimal" value="${esc(x.bought ?? 0)}"></label>`}
    <label class="f">Paid before using the app<input id="it-open" inputmode="decimal" value="${esc(x.openingPaid ?? 0)}"></label>
    ${x.id ? `<p class="muted" style="margin:0;font-size:13px">Paid in total: <b class="num">${money(itemPaid(c, x))}</b></p><button type="button" class="btn danger" data-act="delitem">Remove from this cycle</button>` : ''}
  </form>`, `<button class="btn primary" data-act="saveitem">Save</button>`);
}
function saveItem() {
  const c = S.data.cycles.find(x => x.id === S._item.cycle); if (!c) return;
  const name = $('#it-name').value.trim(); if (!name) { toast('Give it a name.'); return; }
  const n = id => { const el = $('#' + id); if (!el) return null; const v = calc(el.value); return v == null || isNaN(v) ? null : v; };
  c.items = c.items || []; let it = c.items.find(i => i.id === S._item.id);
  if (!it) { it = {id: 'it' + uid(), group: S._item.group}; c.items.push(it); }
  Object.assign(it, {name, planned: n('it-planned'), openingPaid: n('it-open') || 0});
  if (it.group !== 'bills') Object.assign(it, {qty: n('it-qty'), bought: n('it-bought') || 0});
  save(); closeSheet(); render(); toast('Saved');
}

// ---------- backup, restore, CSV ----------
function download(name, text, type) {
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
  catch { openSheet('Copy your file', `<textarea readonly class="inp" style="height:240px">${esc(text)}</textarea>`); }
}
function openRestore() {
  openSheet('Restore from backup', `<p class="muted" style="margin-top:0">Pick a Tally backup (.json) or paste its text. This replaces what’s on this phone.</p>
    <label class="btn dark block" for="rs-file">Choose backup file</label><input id="rs-file" type="file" accept=".json,application/json,text/plain" hidden>
    <textarea id="rs-text" class="inp" placeholder="…or paste the backup text here" style="height:110px;margin-top:10px;font-size:13px"></textarea><div id="rs-out"></div>`, `<button class="btn primary" data-act="dorestore">Restore</button>`);
  $('#rs-file').addEventListener('change', async e => { const f = e.target.files[0]; if (f) $('#rs-text').value = await f.text(); });
}
function doRestore() {
  let b; try { b = JSON.parse($('#rs-text').value); } catch { $('#rs-out').innerHTML = '<div class="banner warn" style="margin-top:10px">That isn’t a valid backup file.</div>'; return; }
  if (!b || b.app !== 'tally' || !Array.isArray(b.cycles) || !Array.isArray(b.entries)) { $('#rs-out').innerHTML = '<div class="banner warn" style="margin-top:10px">That file isn’t a Tally backup.</div>'; return; }
  S.data = {cycles: b.cycles, entries: b.entries, rules: b.rules || {}, settings: b.settings || {currency:'EGP'}, version: 2};
  migrate(); ensureCurrent(); save(); closeSheet(); S.tab = 'today'; render(); toast(`Restored ${b.entries.length} expenses and ${b.cycles.length} cycles`);
}
function parseCsv(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) { const ch = text[i];
    if (q) { if (ch === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { row.push(f); f = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; } else f += ch; }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function importCsv(text) {
  const rows = parseCsv(text.replace(/^﻿/, '')); if (rows.length < 2) { toast('That CSV looks empty.'); return; }
  const h = rows[0].map(x => x.trim().toLowerCase()), col = (...n) => h.findIndex(x => n.includes(x));
  const cD = col('date'), cW = col('wallet','budget','category'), cA = col('amount','actual'), cN = col('item','note','description','name');
  if (cW < 0 || cN < 0) { toast('The CSV needs Wallet and item (or Note) columns.'); return; }
  const toKey = s => { s = String(s||'').trim(); let m;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
    if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${pad(m[2])}-${pad(m[1])}`; } return null; };
  let rules = 0, skipped = 0; S.data.rules = S.data.rules || {};
  for (const r of rows.slice(1)) {
    const w = wk(r[cW]), note = (r[cN] || '').trim(); if (!w || !note) { skipped++; continue; }
    const n = norm(note); S.data.rules[n] = S.data.rules[n] || {}; S.data.rules[n][w] = (S.data.rules[n][w] || 0) + 1; rules++;
  }
  save(); render();
  toast(`Learned ${rules} item→wallet examples${skipped ? ` · skipped ${skipped} rows` : ''}. No amounts were imported.`);
}
function exportCsv() {
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const rows = [['Date','Wallet','Amount','item','Planned item','Sum']].concat([...S.data.entries].sort((a,b)=>a.date.localeCompare(b.date)).map(e => [e.date, WL[e.wallet]?.label || e.wallet, e.amount, e.note || '', e.itemId ? itemById(e.itemId)?.name || '' : '', e.expr || '']));
  download(`tally-${todayKey()}.csv`, rows.map(r => r.map(q).join(',')).join('\n'), 'text/csv');
}

// ---------- events ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (a === 'scrim') { if (e.target === el) closeSheet(); return; }
  switch (a) {
    case 'tab': S.tab = v; closeSheet(); render(); scrollTo(0,0); break;
    case 'close': closeSheet(); break;
    case 'add': openEntry(null, v); break;
    case 'edit': { const en = S.data.entries.find(x => x.id === v); if (en) openEntry(en); break; }
    case 'fsign': S._form.refund = v === '1'; syncForm(false); break;
    case 'fwallet': S._form.wallet = v; S._form.auto = false; S._form.itemId = null; $('#en-why').textContent = ''; syncForm(); break;
    case 'fitem': S._form.itemId = v || null; S._form.itemPicked = true; syncForm(false); break;
    case 'fnote': $('#en-note').value = v; onNote(); break;
    case 'fdate': $('#en-date').value = addDays(todayKey(), +v); syncForm(false); break;
    case 'saveentry': saveEntry(); break;
    case 'delentry': { const id = S._form.id, old = S.data.entries.find(x => x.id === id); S.data.entries = S.data.entries.filter(x => x.id !== id); save(); closeSheet(); render();
      toast('Expense deleted', {label:'Undo', fn: () => { S.data.entries.push(old); save(); render(); }}); break; }
    case 'toastact': S._toastAct?.(); $('#toast-root').innerHTML = ''; break;
    case 'scan': openScan(); break;
    case 'scgo': runScan(); break;
    case 'scstop': rcCtl?.abort(); break;
    case 'sckey': { const k = $('#sc-key').value.trim(); const pv = $('#sc-prov')?.value || 'anthropic';
      if (!k.startsWith(PROVIDERS[pv].prefix)) { toast(`A ${PROVIDERS[pv].name} key starts with ${PROVIDERS[pv].prefix}`); break; }
      try { localStorage.setItem('tally-ai', JSON.stringify({key:k, model: PROVIDERS[pv].model, provider: pv})); } catch { toast('Couldn’t save on this browser.'); break; }
      $('#sc-keybox').outerHTML = '<div class="banner" style="margin-top:12px">Key saved. Now tap Read & route.</div>'; break; }
    case 'pwallet': { const [id, w] = v.split('|'); const p = S._props.find(x => x.id === id); if (p) { p.wallet = w; p.why = 'you chose ' + WL[w].label; const c = S.data.cycles.find(x => x.id === S._propCycle) || curCycle(); p.itemId = matchItem(c, w, p.name)?.id || null; } renderProposals(); break; }
    case 'pconfirm': confirmProposals(); break;
    case 'hcycle': S.histCycle = v; render(); break;
    case 'hwallet': S.histWallet = v; render(); break;
    case 'newitem': openItem(null, v); break;
    case 'edititem': { const it = (curCycle().items||[]).find(i => i.id === v); if (it) openItem(it); break; }
    case 'saveitem': saveItem(); break;
    case 'delitem': { const c = S.data.cycles.find(x => x.id === S._item.cycle); c.items = c.items.filter(i => i.id !== S._item.id); save(); closeSheet(); render(); toast('Removed'); break; }
    case 'newcycle': {
      if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Tap again to confirm'; el.classList.add('danger'); break; }
      const t = todayKey(), c = cycleFor(t); if (!c) break; if (c.start === t) { toast('This cycle already starts today.'); break; }
      const len = daysBetween(c.start, c.end); c.end = addDays(t, -1); const n = nextCycleFrom(c); n.end = addDays(t, len);
      S.data.cycles.push(n); save(); render(); toast(`New cycle ${fmtShort(n.start)} – ${fmtShort(n.end)}`); break; }
    case 'savekey': { const provider = $('#ai-prov')?.value || 'anthropic';
      const key = $('#ai-key').value.trim(), model = $('#ai-model').value.trim() || PROVIDERS[provider].model;
      if (key && !key.startsWith(PROVIDERS[provider].prefix)) { toast(`A ${PROVIDERS[provider].name} key starts with ${PROVIDERS[provider].prefix}`); break; }
      try { localStorage.setItem('tally-ai', JSON.stringify({key, model, provider})); } catch { toast('Couldn’t save on this browser.'); break; } render(); toast(key ? `Scanning is on via ${PROVIDERS[provider].name}` : 'Key removed'); break; }
    case 'backup': download(`tally-backup-${todayKey()}.json`, JSON.stringify({app:'tally', version:1, exportedAt:new Date().toISOString(), cycles:S.data.cycles, entries:S.data.entries, rules:S.data.rules, settings:S.data.settings}), 'application/json'); break;
    case 'restore': openRestore(); break;
    case 'dorestore': doRestore(); break;
    case 'csv': exportCsv(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset?.calc) { const v = calc(t.value), out = document.getElementById(t.dataset.calc); if (out) out.textContent = isExpr(t.value) ? (isNaN(v) || v == null ? 'check the sum' : '= ' + money(v)) : ''; }
  if (t.dataset?.pamt) { const p = S._props.find(x => x.id === t.dataset.pamt); const v = calc(t.value); if (p && v != null && !isNaN(v)) { p.amount = v; const on = S._props.filter(x => x.on); $('#sheet-f [data-act=pconfirm]').textContent = `Confirm ${on.length} · ${money(on.reduce((s,x)=>s+(+x.amount),0))}`; } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'en-date') syncForm(false);
  if (t.dataset?.tog) $('#' + t.dataset.tog).hidden = t.checked;
  if (t.dataset?.pon) { const p = S._props.find(x => x.id === t.dataset.pon); if (p) { p.on = t.checked; renderProposals(); } }
  if (t.dataset?.pitem) { const p = S._props.find(x => x.id === t.dataset.pitem); if (p) p.itemId = t.value || null; }
  if (t.id === 'csv-file' && t.files[0]) { t.files[0].text().then(importCsv); t.value = ''; }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'cycle-form') {
    const c = curCycle(), st = $('#cy-start').value, en = $('#cy-end').value;
    if (!st || !en || en < st) { toast('Check the cycle dates.'); return; }
    const clash = S.data.cycles.find(x => x !== c && x.start <= en && x.end >= st); if (clash) { toast(`Those dates overlap the ${fmtShort(clash.start)} cycle.`); return; }
    for (const w of WALLETS) { const raw = $('#cy-' + w.k).value.trim(), v = calc(raw); if (raw && (v == null || isNaN(v))) { toast(`Check the ${w.label} budget.`); return; } c.budgets[w.k] = {expr: raw, value: v || 0}; }
    const hl = $('#cy-home-list'); if (hl) c.homeMode = hl.checked ? 'list' : 'manual';
    const ul = $('#cy-utilities-list'); if (ul) c.utilMode = ul.checked ? 'list' : 'manual';
    const oldId = c.id; c.start = st; c.end = en; c.id = st; if (S.histCycle === oldId) S.histCycle = st;
    ensureCurrent(); save(); render(); toast('Cycle and budgets saved');
  }
  if (e.target.id === 'setup-form') {
    const st = $('#su-start').value, en = $('#su-end').value; if (!st || !en || en < st) { toast('Check the dates.'); return; }
    const budgets = {}; for (const w of WALLETS) { const raw = $('#su-' + w.k).value.trim(), v = calc(raw); budgets[w.k] = {expr: raw, value: isNaN(v) || v == null ? 0 : v}; }
    S.data.cycles.push({id: st, start: st, end: en, budgets, items: []}); S.data.version = 2; ensureCurrent(); save(); render();
  }
  if (e.target.id === 'item-form') saveItem();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); if (e.key === 'Enter' && e.target.id === 'en-amt') { e.preventDefault(); saveEntry(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.data.cycles.length) { ensureCurrent(); render(); } });

load(); ensureCurrent(); render();
})();
</script>
